
name: MATRIX BLUETOOTH ENGINE Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc g++ \
            libelf-dev libgmp-dev libncurses5-dev libssl-dev \
            libtool libtool-bin make texinfo patch wget zlib1g-dev \
            pkg-config subversion git python3 python-is-python3 clang

      - name: Build PS3DEV
        run: |
          git clone https://github.com/ps3dev/ps3dev.git "$HOME/ps3dev"
          cd "$HOME/ps3dev"
          export PS3DEV="$HOME/ps3dev"
          export PSL1GHT="$PS3DEV"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          ./build-all.sh
          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Build MATRIX
        working-directory: matrix_bt_project
        run: |
          make clean
          make
          make pkg

      - name: Upload PS3 Files
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-BLUETOOTH-PS3
          path: |
            matrix_bt_project/*.pkg
            matrix_bt_project/*.self
            matrix_bt_project/*.elf
          if-no-files-found: error
