
name: MATRIX BLUETOOTH ENGINE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PS3 Homebrew
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison flex gcc g++ \
            libelf-dev libgmp-dev libncurses5-dev \
            libssl-dev libtool libtool-bin make \
            texinfo patch wget zlib1g-dev \
            pkg-config subversion git python3 \
            python-is-python3 clang curl p7zip-full

      - name: Download PS3DEV Toolchain
        run: |
          set -e

          URL="https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz"

          curl -fL "$URL" -o "$RUNNER_TEMP/ps3dev.tar.gz"

          tar -xzf "$RUNNER_TEMP/ps3dev.tar.gz" -C "$GITHUB_WORKSPACE"

          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"

          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Verify PS3DEV
        run: |
          set -e

          test -f "$PS3DEV/ppu_rules"
          test -f "$PS3DEV/bin/sfo.xml"
          test -f "$PS3DEV/bin/ICON0.PNG"

          ppu-gcc --version
          sfo --help || true

      - name: Verify MATRIX Project
        run: |
          set -e

          test -f main.c
          test -f Makefile
          test -f ICON0.PNG

      - name: Build MATRIX
        run: |
          set -e

          make clean
          make
          make pkg

      - name: Upload PS3 Files
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-BLUETOOTH-PS3
          path: |
            *.pkg
            *.self
            *.elf
          if-no-files-found: error
